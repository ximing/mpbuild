name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install example/demo npm deps used by the gold test
        run: npm install --prefix example/demo --no-save --package-lock=false --ignore-scripts --no-audit --no-fund util@^0.12.5 querystring@^0.2.0
      - run: pnpm --filter @mpbuild/core test -- --run
