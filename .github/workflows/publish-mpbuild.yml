name: publish-mpbuild

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install example/demo npm deps used by the gold test
        # The demo's package-lock pins dead taobao/nlark mirrors, so install
        # just the resolvable deps straight from npmjs without the lockfile.
        run: npm install --prefix example/demo --no-save --package-lock=false --ignore-scripts --no-audit --no-fund util@^0.12.5 querystring@^0.2.0
      - run: pnpm --filter @mpbuild/core test -- --run
      - name: Check tag matches package versions
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "publish only from tags matching v*"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          CORE_VER="$(node -p "require('./packages/core/package.json').version")"
          CLI_VER="$(node -p "require('./packages/cli/package.json').version")"
          if [[ "${CORE_VER}" != "${CLI_VER}" ]]; then
            echo "core ${CORE_VER} != cli ${CLI_VER}"
            exit 1
          fi
          if [[ "${TAG}" != "v${CORE_VER}" ]]; then
            echo "tag ${TAG} != v${CORE_VER}"
            exit 1
          fi
      - run: pnpm publish -r --filter @mpbuild/core --filter @mpbuild/cli --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
