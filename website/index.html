<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mpbuild - 图驱动的微信小程序构建工具</title>
    <meta name="description" content="mpbuild：图驱动的微信小程序构建工具。SWC + Lightning CSS，精准分包，增量缓存。" />
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <script>
      // 首帧前确定主题，避免浅色/深色闪烁：
      // 优先 localStorage 手动选择，其次跟随系统 prefers-color-scheme。
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var t = q === 'light' || q === 'dark' ? q : localStorage.getItem('mpbuild-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
